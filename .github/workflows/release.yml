name: Release

# Manual only. Official releases are built and signed locally with a Developer ID
# (./scripts/build.sh --version X.Y.Z --zip) and uploaded with `gh release create`,
# so a tag push must not overwrite that asset with an ad-hoc-signed CI build.
# Use this workflow to produce an unsigned test build for a tag when needed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.0)"
        required: true

# Signing: CI uses ad-hoc codesign (CODESIGN_IDENTITY=-) because GitHub-hosted
# runners have no Developer ID certificate. Maintainers can later replace this
# with a real Developer ID Application cert imported from GitHub secrets.
# Secret import is intentionally not implemented here.

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Build ad-hoc signed zip
        env:
          CODESIGN_IDENTITY: "-"
          TAG: ${{ inputs.tag }}
        run: ./scripts/build.sh --version "${TAG#v}" --zip

      - name: Checksum for Homebrew cask
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          ZIP="build/BrightBar-${VERSION}.zip"
          SHA256="$(shasum -a 256 "$ZIP" | awk '{ print $1 }')"
          {
            echo "## Cask checksum"
            echo ""
            echo "Pin \`Casks/brightbar.rb\` after this release:"
            echo ""
            echo "\`\`\`"
            echo "version \"${VERSION}\""
            echo "sha256 \"${SHA256}\""
            echo "\`\`\`"
            echo ""
            echo "\`./scripts/update-cask.sh ${VERSION} ${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 ${SHA256}"

      - name: Upload test build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightBar-${{ inputs.tag }}-adhoc
          path: build/BrightBar-*.zip
          if-no-files-found: error
